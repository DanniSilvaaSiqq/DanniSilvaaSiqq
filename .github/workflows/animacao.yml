name: Generate Animation

on:
  # Executa automaticamente a cada 24 horas
  schedule:
    - cron: "0 0 * * *" 
  
  # Permite rodar o script manualmente
  workflow_dispatch:
  
  # Executa toda vez que você fizer um push na branch main
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Gera o jogo a partir do seu gráfico de contribuições
      - name: generate github-contribution-grid-animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-dark.svg?palette=github-dark
            dist/github-contribution-grid-light.svg?palette=github-light

      # Envia os arquivos gerados para a branch "output"
      - name: push animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
